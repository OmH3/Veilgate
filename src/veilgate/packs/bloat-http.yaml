version: "1"
name: "bloat-http"
description: "Universal HTTP response header and protocol envelope bloat stripping patterns"

drop_keys:
  - "connection"
  - "keep-alive"
  - "server"
  - "date"
  - "etag"
  - "via"
  - "vary"
  - "content-security-policy"
  - "strict-transport-security"
  - "x-content-type-options"
  - "x-frame-options"
  - "x-xss-protection"
  - "x-request-id"
  - "x-correlation-id"
  - "x-envoy-upstream-service-time"
  - "x-powered-by"
  - "cf-ray"
  - "cf-cache-status"
  - "set-cookie"
  - "cookie"
  - "authorization"
  - "_links"
  - "_metadata"
  - "__v"

drop_patterns:
  - "^headers\\.x-"
  - "^headers\\.(connection|server|date|etag|via|vary|cookie|set-cookie)"
