name: Publish to PyPI / TestPyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish destination registry'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
  push:
    tags:
      - 'v*'       # Official release to PyPI (e.g., v0.1.0)
      - 'test-v*'  # Test release to TestPyPI (e.g., test-v0.1.0)

jobs:
  test:
    name: Run Quality Gate & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  build:
    name: Build Distribution Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package distributions with twine
        run: uvx twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test-v'))
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/veilgate
    permissions:
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN != '' }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI (Trusted Publishing / OIDC)
        if: env.HAS_TOKEN == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to TestPyPI (API Token)
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-to-pypi:
    name: Publish to Official PyPI
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/test-v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/veilgate
    permissions:
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: env.HAS_TOKEN == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI (API Token)
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
